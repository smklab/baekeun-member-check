services:
  - type: web
    name: baekeun-member-check
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free
    envVars:
      - key: ADMIN_CONTACT
        sync: false
      - key: APPS_SCRIPT_WEB_APP_URL
        sync: false
      - key: APPS_SCRIPT_SHARED_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: APP_TITLE
        value: 백은공종중 종원 확인
      - key: ADMIN_TITLE
        value: 백은공종중 주소 관리
