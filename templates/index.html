<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>문희공파백은공종중 종원 확인</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --border: #dde3ee;
      --text: #1d2433;
      --muted: #667085;
      --accent: #234a8b;
      --ok-bg: #edf7ed;
      --ok-text: #176438;
      --err-bg: #fff3f0;
      --err-text: #a53b2d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: linear-gradient(180deg, #f7f9fc 0%, #eef2f7 100%);
      color: var(--text);
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
      padding: 28px 22px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.4rem;
      line-height: 1.35;
      text-align: center;
    }
    p.desc {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
      text-align: center;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .field { margin-bottom: 16px; }
    input {
      width: 100%;
      padding: 14px 15px;
      border-radius: 14px;
      border: 1px solid var(--border);
      font-size: 1rem;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
      background: #fff;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(35, 74, 139, 0.12);
    }
    .hint {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.45;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px;
      font-size: 1rem;
      font-weight: 700;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }
    .result {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 16px;
      font-size: 0.98rem;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .result.ok {
      display: block;
      background: var(--ok-bg);
      color: var(--ok-text);
    }
    .result.err {
      display: block;
      background: var(--err-bg);
      color: var(--err-text);
    }
    .footnote {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.55;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card">
      <h1>문희공파백은공종중 종원 확인</h1>
      <p class="desc">성명과 연락처를 입력하시면 종원 등록 여부를 확인하실 수 있습니다.</p>

      <form id="member-form">
        <div class="field">
          <label for="name">성명</label>
          <input id="name" name="name" type="text" placeholder="예: 신갑례 / 갑례 / 현숙" autocomplete="name" required />
          <div class="hint">전체 이름, 성을 제외한 이름, 괄호 안 이름으로도 조회할 수 있습니다.</div>
        </div>

        <div class="field">
          <label for="phone">연락처</label>
          <input id="phone" name="phone" type="tel" placeholder="예: 010-1234-5678" inputmode="numeric" autocomplete="tel" required />
          <div class="hint">숫자만 입력하거나 하이픈을 포함해 입력하셔도 됩니다.</div>
        </div>

        <button id="submit-btn" type="submit">종원 여부 확인</button>
      </form>

      <div id="result" class="result" aria-live="polite"></div>

      <div class="footnote">입력하신 정보는 조회용으로만 사용됩니다.</div>
    </main>
  </div>

  <script>
    const form = document.getElementById('member-form');
    const resultBox = document.getElementById('result');
    const submitButton = document.getElementById('submit-btn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();

      resultBox.className = 'result';
      resultBox.style.display = 'none';
      submitButton.disabled = true;
      submitButton.textContent = '확인 중...';

      try {
        const response = await fetch('/api/check-member', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, phone })
        });

        const data = await response.json();
        resultBox.textContent = data.message || '처리 중 오류가 발생했습니다.';
        resultBox.classList.add(data.matched ? 'ok' : 'err');
        resultBox.style.display = 'block';
      } catch (error) {
        resultBox.textContent = '서버 연결 중 오류가 발생했습니다. 잠시 후 다시 시도해 주십시오.';
        resultBox.classList.add('err');
        resultBox.style.display = 'block';
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = '종원 여부 확인';
      }
    });
  </script>
</body>
</html>
