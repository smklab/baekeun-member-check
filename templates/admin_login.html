<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} 로그인</title>
  <style>
    body{margin:0;padding:24px;background:#eef2f7;color:#162033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;}
    .wrap{max-width:520px;margin:60px auto;background:#fff;border:1px solid #dbe4f0;border-radius:24px;padding:32px;box-shadow:0 8px 24px rgba(18,28,45,.05);}
    h1{margin:0 0 10px;font-size:34px;}
    p{color:#6b7890;}
    label{display:block;font-weight:700;margin:18px 0 10px;font-size:18px;}
    input{width:100%;padding:18px;border:1px solid #cfd8e6;border-radius:16px;font-size:17px;}
    button{width:100%;margin-top:20px;padding:18px;border:none;border-radius:16px;background:#2d559a;color:#fff;font-size:20px;font-weight:800;cursor:pointer;}
    .error{margin-top:18px;padding:14px 16px;border-radius:14px;background:#fff1f2;color:#b42318;}
    .back{margin-top:12px;font-size:14px;}
    a{color:#6b7890;text-decoration:none;}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>{{ title }}</h1>
    <p>관리자 비밀번호를 입력하시면 제출된 주소를 조회하고 수정할 수 있습니다.</p>
    <form method="post" action="/admin/login">
      <label for="password">관리자 비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="비밀번호 입력">
      <button type="submit">로그인</button>
    </form>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <div class="back"><a href="/">← 종원 확인 페이지로 돌아가기</a></div>
  </div>
</body>
</html>
